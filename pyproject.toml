[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-sft"
version = "0.1.0"
description = "Evidence-first multimodal PDF SFT data pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "huggingface-hub>=0.30",
  "httpx>=0.27",
  "liteparse==2.5.0",
  "openai>=2.0",
  "pyarrow>=17",
  "pydantic>=2.10",
  "pymupdf>=1.25",
  "pyyaml>=6.0",
  "tokenizers>=0.22",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
pdf-sft = "pdf_sft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_sft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
