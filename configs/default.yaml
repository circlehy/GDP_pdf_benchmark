schema_version: "0.1"
project_root: "."

paths:
  discovery: "data/discovery/document_candidates.jsonl"
  documents: "data/documents/documents.jsonl"
  raw_pdfs: "raw_pdfs"
  parsed: "parsed"
  document_views: "data/document_views"
  input_packages: "data/input_packages"
  generated: "data/generated/candidates.jsonl"
  verified: "data/validated/verified.jsonl"
  deduplicated: "data/validated/deduplicated.jsonl"
  repaired: "data/validated/repaired.jsonl"
  finalized: "data/validated/finalized.jsonl"
  rejected: "data/validated/rejected.jsonl"
  hard: "data/validated/hard.jsonl"
  exports: "data/exports"
  logs: "logs"

security:
  forbidden_input_roots:
    - "benchmarks"
  forbidden_source_substrings:
    - "huggingface.co/datasets/surgeai/GDP.pdf"
    - "surgeai/GDP.pdf"
  allowed_download_schemes:
    - "https"
  max_pdf_bytes: 209715200

parse:
  text_extractor: "liteparse"
  text_extractor_version: "2.5.0"
  ocr_enabled: true
  ocr_language: "eng"
  tessdata_path: ".cache/liteparse/tessdata"
  num_workers: 4
  dpi: 150
  image_format: "png"
  native_text_min_chars_per_page: 40

target_input:
  profile: "multimodal"
  page_image_dpi: 150
  minimum_page_image_dpi: 72
  page_image_packing: "single_page"
  include_all_pages: true
  evidence_graph_in_prompt: false

context_budget:
  model_context_tokens: 524288
  target_input_utilization: 0.80
  preferred_input_utilization_min: 0.70
  preferred_input_utilization_max: 0.85
  maximum_input_utilization: 0.90
  minimum_output_and_safety_reserve_tokens: 32768
  question_reserve_tokens: 4096
  system_prompt_reserve_tokens: 2048
  # Set this to the target model's tokenizer directory for exact text-token counts.
  text_tokenizer_path: null
  provisional_chars_per_token: 3.5
  provisional_image_tokens_per_megapixel: 1200

document_view:
  # Optional explicit bounded views keyed by document_id or its SHA suffix.
  # A bounded view is frozen before task generation and must later pass omitted-page audit.
  overrides: {}

generation:
  candidates_per_document: 3
  batches_per_document: 1
  target_difficulty: "standard"
  hard_min_evidence_nodes: 3
  hard_min_evidence_pages: 2
  hard_min_dependent_operations: 3
  max_structure_repair_attempts: 1
  primary_evidence_type_weights:
    visual_spatial: 0.40
    structured_layout: 0.45
    text_reasoning: 0.15

deduplication:
  max_tasks_per_document: 3
  bbox_match_iou: 0.30
  max_evidence_page_jaccard: 0.50
  max_evidence_region_jaccard: 0.50
  max_prompt_token_jaccard: 0.75
  max_page_operation_jaccard: 0.80

difficulty:
  minimum_evidence_nodes: 2
  minimum_dependent_operations: 2
  require_non_lookup_operation: true
  require_controlling_evidence: true
  require_tier_2_axis: true
  require_tier_3_axis: true

verification:
  max_reconstruction_attempts: 2
  minimum_reconstructed_answer_chars: 256
  require_labeled_subquestion_coverage: true
  audit_image_scope: "evidence_pages"
  audit_include_complete_document_text: true
  audit_include_evidence_crops: true
  audit_crop_padding_ratio: 0.10
  audit_crop_min_side_pixels: 256
  audit_bbox_min_page_token_coverage: 0.45
  audit_bbox_min_relative_token_coverage: 0.50
  audit_bbox_repair_max_blocks: 6
  audit_bbox_repair_min_token_coverage: 0.60
  audit_bbox_repair_min_improvement: 0.20

models:
  generator:
    provider: "openai_responses"
    model: "gpt-6-astra"
    base_url: null
    api_key_env: "OPENAI_API_KEY"
    reasoning_effort: "high"
    max_output_tokens: 12000
  verifier:
    provider: "openai_compatible_chat"
    model: "REPLACE_WITH_LOCAL_VLM"
    base_url: "http://127.0.0.1:8000/v1"
    api_key_env: "LOCAL_VLM_API_KEY"
    reasoning_effort: null
    max_output_tokens: 8000
  verifier_long_context: null
  judge:
    provider: "openai_responses"
    model: "gpt-5.6-sol"
    base_url: null
    api_key_env: "OPENAI_API_KEY"
    reasoning_effort: "medium"
    max_output_tokens: 2000
