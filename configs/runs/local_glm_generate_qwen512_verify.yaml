extends: "configs/runs/local_glm_generate_qwen_verify.yaml"
run_id: "local_glm_generate_qwen512_verify_v0"

paths:
  generated: "data/runs/local_glm_generate_qwen512_verify/generated.jsonl"
  verified: "data/runs/local_glm_generate_qwen512_verify/verified.jsonl"
  repaired: "data/runs/local_glm_generate_qwen512_verify/repaired.jsonl"
  finalized: "data/runs/local_glm_generate_qwen512_verify/finalized.jsonl"
  rejected: "data/runs/local_glm_generate_qwen512_verify/rejected.jsonl"
  hard: "data/runs/local_glm_generate_qwen512_verify/hard.jsonl"
  exports: "data/runs/local_glm_generate_qwen512_verify/exports"

models:
  verifier:
    provider: "openai_compatible_chat"
    model: "Qwen3.8-27B-512K"
    base_url: null
    base_url_env: "QWEN_VLM_512K_BASE_URL"
    api_key_env: "LOCAL_VLM_API_KEY"
    reasoning_effort: "xhigh"
    context_window_tokens: 524288
    max_output_tokens: 32768
    temperature: 0.1
    top_p: 0.95
  verifier_long_context: null
